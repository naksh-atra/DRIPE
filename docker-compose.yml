services:
  api:
    build: .
    container_name: dripe_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - neo4j
      - mongodb
      - redis
    networks:
      - dripe_network

  neo4j:
    image: neo4j:2026.02.2
    container_name: dripe_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_data:/data
    networks:
      - dripe_network

  mongodb:
    image: mongo:8.0
    container_name: dripe_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - dripe_network

  redis:
    image: redis:8.0
    container_name: dripe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dripe_network

networks:
  dripe_network:
    driver: bridge

volumes:
  neo4j_data:
  mongodb_data:
  redis_data:
